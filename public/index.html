<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forex Vision Pros AI Autopilot</title><style>
:root{--bg:#06101b;--panel:#0c1a28;--line:#1d3448;--text:#eef6ff;--muted:#91a6b9;--accent:#19d3ae;--blue:#4ea1ff;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101b,#0a1f33);font-family:Arial,sans-serif;color:#eef6ff;overflow-x:hidden}header{background:linear-gradient(90deg,#0c1a28,#122438);border-bottom:1px solid #1d3448;padding:0.75rem 0;position:sticky;top:0;z-index:100}header .wrap{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto;padding:0 1rem}header .brand{font-size:1.25rem;font-weight:700;letter-spacing:0.08em;color:#19d3ae}header .tag{font-size:0.75rem;color:#91a6b9;letter-spacing:0.05em}main{max-width:1200px;margin:0 auto;padding:1rem}section{background:#0c1a28;border:1px solid #1d3448;border-radius:6px;padding:1.5rem;margin-bottom:1rem}section h2{margin:0 0 1rem;color:#19d3ae;font-size:1.1rem}section p{margin:0 0 0.75rem;font-size:0.95rem;line-height:1.6;color:#e0eaf5}button{background:#19d3ae;color:#06101b;border:none;padding:0.75rem 1.5rem;border-radius:4px;font-weight:700;cursor:pointer;font-size:0.95rem;transition:background 0.2s}button:hover{background:#1ac9a4}button:active{transform:scale(0.98)}label{display:inline-flex;align-items:center;gap:0.5rem;cursor:pointer;margin-bottom:0.5rem}input[type="checkbox"]{cursor:pointer}input[type="text"]{background:#06101b;border:1px solid #1d3448;color:#eef6ff;padding:0.5rem;border-radius:4px;width:100%;max-width:400px;font-size:0.95rem;margin-bottom:0.5rem}.small{font-size:0.85rem;color:#91a6b9;margin-top:1rem}.status{background:#122438;border-left:3px solid #19d3ae;padding:0.75rem;border-radius:4px;margin:1rem 0;font-size:0.9rem}#msg{color:#19d3ae;font-weight:700;margin:1rem 0 0}#library{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-top:1rem}@media(max-width:600px){header .wrap{flex-direction:column;gap:0.5rem}header .brand{font-size:1.1rem}main{padding:0.75rem}section{padding:1rem}button{width:100%;padding:0.85rem}input[type="text"]{max-width:100%}#library{grid-template-columns:1fr}.video-card{flex-direction:column}}.video-card{background:#06101b;border:1px solid #1d3448;border-radius:4px;padding:1rem;display:flex;flex-direction:column;gap:0.75rem}.video-card h3{margin:0;color:#19d3ae;font-size:0.95rem}.video-card p{margin:0;font-size:0.85rem;color:#91a6b9}.video-card video{width:100%;height:auto;border-radius:4px;background:#000;margin-top:0.5rem}.video-card .actions{display:flex;gap:0.5rem;margin-top:0.5rem}.video-card button{flex:1;padding:0.5rem;font-size:0.85rem}
</style></head><body><header><div class="wrap" style="padding:0"><div class="brand">FOREX VISION PROS</div><div class="tag">AI CONTENT AUTOPILOT • Learn Forex • Understand Markets • Trade With Discipline</div></div></header><main><section><h2>Dashboard</h2><div id="status" class="status">Loading...</div></section><section><h2>Academy Auto-Lesson</h2><p>Generate the next lesson from our Forex Academy lesson bank.</p><button onclick="lesson()">Generate Academy Lesson</button><div id="msg"></div></section><section><h2>Generate Custom Video</h2><label><input type="checkbox" id="auto"> Autopilot mode (generate continuously)</label> <button onclick="saveSettings()">Save</button><br><p>Create a custom Forex education video.</p><div><label>Topic: <input type="text" id="topic" placeholder="e.g. What is leverage?" value="What is leverage?"></label></div><div><label>Level: <select id="level" style="background:#06101b;border:1px solid #1d3448;color:#eef6ff;padding:0.5rem;border-radius:4px"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label></div><div><label>Duration (seconds): <input type="text" id="duration" placeholder="30" value="30" style="max-width:100px"></label></div><div><label>Angle (optional): <input type="text" id="angle" placeholder="e.g. Risk management perspective"></label></div><button onclick="generate()">Generate Video</button></section><section><h2>Video Library</h2><div id="library"></div></section></main><script>
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{const s=await api('/api/status');document.getElementById('status').textContent=`Engine online • Video renderer ${s.ffmpeg?'ready':'missing'} • AI ${s.geminiConfigured?'connected':'not configured'} • Model: ${s.model}`;renderLibrary()}catch(e){document.getElementById('status').textContent=`Error: ${e.message}`}}
async function saveSettings(){await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({autopilot:document.getElementById('auto').checked})})}
async function generate(){const msg=document.getElementById('msg');msg.textContent='Generating script and rendering MP4...';try{await api('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:document.getElementById('topic').value,level:document.getElementById('level').value,duration:Number(document.getElementById('duration').value)||30,angle:document.getElementById('angle').value})}),msg.textContent='Video queued. Refresh in 30s for status.';setTimeout(renderLibrary,2000)}catch(e){msg.textContent=`Error: ${e.message}`}}
async function lesson(){const msg=document.getElementById('msg');msg.textContent='Generating the next Academy lesson...';try{await api('/api/generate-lesson',{method:'POST'}),msg.textContent='Academy lesson queued. Refresh in 30s for status.';setTimeout(renderLibrary,2000)}catch(e){msg.textContent=`Error: ${e.message}`}}
async function del(id){if(!confirm('Delete this video?'))return;await api('/api/content/'+id,{method:'DELETE'});renderLibrary()}
async function renderLibrary(){const items=await api('/api/content');const el=document.getElementById('library');if(!items.length){el.innerHTML='<div class="small">No videos yet. Generate your first lesson or custom video above.</div>';return}el.innerHTML=items.map(item=>`<div class="video-card"><h3>${item.topic}</h3><p>Level: ${item.level} • Status: ${item.status}</p>${item.videoUrl?`<video controls><source src="${item.videoUrl}" type="video/mp4"></video>`:`<p class="small">Rendering...</p>`}<div class="actions"><button onclick="del('${item.id}')">Delete</button></div></div>`).join('')}
load();
</script></body></html>
